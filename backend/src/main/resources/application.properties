spring.application.name=payleech

# MySQL local. Sobrescreva DB_URL se o servidor usar outro host, porta ou nome.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/payleech}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# O Hibernate apenas confere o mapeamento das entidades com o banco.
# A criação e as alterações do esquema serão feitas por SQL explícito.
spring.jpa.hibernate.ddl-auto=validate

# Chave opcional para consulta de preços de assinaturas pelo World Price Index.
# Defina WORLD_PRICE_INDEX_API_KEY no ambiente do backend; mantenha a chave fora do repositório.
world-price-index.api-key=${WORLD_PRICE_INDEX_API_KEY:}
