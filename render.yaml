services:
  - type: web
    name: payleech-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: virginia
    plan: free
    healthCheckPath: /auth/csrf
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false
      - key: WORLD_PRICE_INDEX_API_KEY
        sync: false
      - key: SERVER_SERVLET_SESSION_COOKIE_SAME_SITE
        value: none
      - key: SERVER_SERVLET_SESSION_COOKIE_SECURE
        value: "true"
